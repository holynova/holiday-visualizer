<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">节假日历 — 中国大陆节假日、调休补班与请假连休日历</title>
  <desc id="desc">深绿底：节假日历；右侧是微缩年历，1 月元旦与 2 月春节用浅绿框出，下方一张请假方案卡：中秋+国庆，请 3 天连休 13 天。</desc>

  <rect width="1200" height="360" rx="26" fill="#14291f"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#9db8a9">中国大陆 · MAINLAND CHINA PUBLIC HOLIDAYS</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f5f0e1">节假日历</text>
    <text x="56" y="168" font-size="23" fill="#d8e6dc">HOLIDAY VISUALIZER — 放假、调休、请假连休，一张年历查清</text>
    <text x="56" y="204" font-size="19" fill="#9db8a9">覆盖 2016–2027 年，点一天就知道放不放假、要不要补班。</text>
    <g id="chips" font-size="18" fill="#f5f0e1" text-anchor="middle">
      <g><rect x="56" y="238" width="186" height="36" rx="18" fill="#1e3a2b" stroke="#33543f" stroke-width="1.5"/><text x="149" y="262">2016–2027 · 12 年</text></g>
      <g><rect x="254" y="238" width="186" height="36" rx="18" fill="#1e3a2b" stroke="#33543f" stroke-width="1.5"/><text x="347" y="262">2026 年 33 天假</text></g>
      <g><rect x="452" y="238" width="150" height="36" rx="18" fill="#1e3a2b" stroke="#33543f" stroke-width="1.5"/><text x="527" y="262">请假拼连休</text></g>
      <g><rect x="614" y="238" width="126" height="36" rx="18" fill="#1e3a2b" stroke="#33543f" stroke-width="1.5"/><text x="677" y="262">移动优先</text></g>
    </g>
  </g>

  <g id="calendar-motif" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="830" y="44" font-size="18" fill="#9db8a9">2026 年 · 全年 365 天</text>
    <!-- mini calendar card -->
    <g>
      <rect x="800" y="60" width="340" height="176" rx="14" fill="#f5f0e1"/>
      <text x="824" y="92" font-size="20" font-weight="700" fill="#14291f">1 月</text>
      <text x="1080" y="92" font-size="16" fill="#4a6353" text-anchor="end">元旦</text>
      <g font-size="15" text-anchor="middle" fill="#4a6353">
        <text x="830" y="116">一</text><text x="868" y="116">二</text><text x="906" y="116">三</text><text x="944" y="116">四</text><text x="982" y="116">五</text><text x="1020" y="116">六</text><text x="1058" y="116">日</text>
      </g>
      <!-- holiday block Jan 1-3 (Thu-Sat), make-up Jan 4 (Sun) -->
      <rect x="930" y="124" width="104" height="26" rx="6" fill="#cfe8d4" stroke="#5f9a6e" stroke-width="1.5"/>
      <rect x="1044" y="124" width="28" height="26" rx="6" fill="#f5d9a8" stroke="#b98a2e" stroke-width="1.5"/>
      <g font-size="15" text-anchor="middle" fill="#14291f">
        <text x="944" y="142" font-weight="700">1</text><text x="982" y="142" font-weight="700">2</text><text x="1020" y="142" font-weight="700">3</text>
        <text x="1058" y="142" font-weight="700">4</text>
        <text x="830" y="168">5</text><text x="868" y="168">6</text><text x="906" y="168">7</text><text x="944" y="168">8</text><text x="982" y="168">9</text><text x="1020" y="168">10</text><text x="1058" y="168">11</text>
        <text x="830" y="194">12</text><text x="868" y="194">13</text><text x="906" y="194">14</text><text x="944" y="194">15</text><text x="982" y="194">16</text><text x="1020" y="194">17</text><text x="1058" y="194">18</text>
      </g>
      <rect x="824" y="204" width="14" height="14" rx="3" fill="#cfe8d4" stroke="#5f9a6e"/>
      <text x="844" y="216" font-size="14" fill="#4a6353">节日放假</text>
      <rect x="924" y="204" width="14" height="14" rx="3" fill="#f5d9a8" stroke="#b98a2e"/>
      <text x="944" y="216" font-size="14" fill="#4a6353">调休补班 · 1 月 4 日</text>
    </g>
    <!-- leave plan chip -->
    <g>
      <rect x="800" y="250" width="340" height="64" rx="14" fill="#1e3a2b" stroke="#33543f" stroke-width="1.5"/>
      <text x="824" y="278" font-size="20" font-weight="700" fill="#f5f0e1">中秋 + 国庆</text>
      <text x="824" y="302" font-size="17" fill="#9db8a9">请 3 天 · 连休 13 天</text>
      <text x="1116" y="290" font-size="22" font-weight="700" fill="#e8c96a" text-anchor="end">4.3 倍</text>
    </g>
  </g>
</svg>
